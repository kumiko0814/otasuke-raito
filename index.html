<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>おたすけ らいと君</title>
<style>
:root{--bg:#f7eef2;--paper:#fff;--ink:#4f454e;--plum:#574a58;--sub:#7d6d79;--line:#f3e3ec;--pink:#f0a2c5;--pinkd:#c66f96;--lav:#C99BE8;--lavd:#9E77D6;--grad:linear-gradient(135deg,#F5A6C8,#B98BEA);--shadow:0 12px 28px -18px rgba(87,74,88,.35);--soft:#fff7fa;--app:linear-gradient(180deg,#fdf1f4 0%,#fbe9ee 55%,#f3f0f7 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c26;--paper:#2f2632;--ink:#f1e8ee;--plum:#f3e9f0;--sub:#b9a9b5;--line:#443a48;--soft:#3a3040;--app:linear-gradient(180deg,#2a2130,#241c26);--shadow:0 12px 28px -18px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#241c26;--paper:#2f2632;--ink:#f1e8ee;--plum:#f3e9f0;--sub:#b9a9b5;--line:#443a48;--soft:#3a3040;--app:linear-gradient(180deg,#2a2130,#241c26);--shadow:0 12px 28px -18px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--app);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","YuGothic","游ゴシック","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.75;min-height:100vh;min-height:100dvh}
.app{max-width:560px;margin:0 auto;padding-block:14px 110px;padding-inline:16px}
.hud{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.hud img{height:22px;width:auto}.hud b{color:var(--plum);font-size:14px}.hud small{color:var(--sub);font-size:11px;display:block;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
.bubble{position:relative;flex:1;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:13.5px}
.bubble:before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:var(--soft);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.buddy{width:56px;height:56px;flex:none}.buddy svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--paper);color:var(--plum);border-radius:14px;padding:11px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent}
label{display:block;font-size:12px;font-weight:800;color:var(--plum);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.g2{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--pink);border-radius:16px;padding:14px;text-align:center;background:var(--soft);cursor:pointer;color:var(--pinkd);font-weight:800;font-size:13.5px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.cta{display:block;width:100%;margin-top:14px;text-align:center;font-weight:800;color:#fff;background:var(--grad);border:0;border-radius:999px;padding:14px;font-size:15px;cursor:pointer;box-shadow:0 10px 22px -12px rgba(185,139,234,.7)}
.cta:disabled{opacity:.55;cursor:default}
.ghost{background:var(--paper);color:var(--pinkd);border:1.5px solid var(--pink);box-shadow:none}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;background:#fbe9ee;color:#c66f96;white-space:nowrap}
.pill.lav{background:#efe6f8;color:#7d5cb0}
.res h3{font-size:13px;color:var(--plum);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.copy{font:inherit;font-size:11.5px;font-weight:800;color:var(--pinkd);background:var(--paper);border:1.5px solid var(--pink);border-radius:999px;padding:4px 10px;cursor:pointer}
.box{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.cnt{font-size:11px;color:var(--sub);font-weight:700}
.price{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.price div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center}
.price b{display:block;font-size:17px;color:var(--plum);font-variant-numeric:tabular-nums}.price span{font-size:10.5px;color:var(--sub)}
.check{font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}.check:first-child{border-top:0}
.note{font-size:11.5px;color:var(--sub);margin-top:8px}
.chat{display:flex;flex-direction:column;gap:8px}
.me{align-self:flex-end;max-width:85%;background:var(--grad);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 12px;font-size:13.5px;white-space:pre-wrap}
.ai{align-self:flex-start;max-width:92%;background:var(--soft);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:13.5px;white-space:pre-wrap}
.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1}.ask button{flex:none;border:0;background:var(--grad);color:#fff;font-weight:800;border-radius:14px;padding:0 16px;font:inherit;cursor:pointer}
.err{font-size:13px;color:#b8412a;margin-top:8px;font-weight:700}
.fab{position:fixed;left:12px;bottom:14px;font-size:11px;font-weight:800;color:var(--pinkd);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 12px;box-shadow:var(--shadow);z-index:50}
[hidden]{display:none!important}
</style>
</head><body>

<script>
(function(){
  var PAL={A:'#8a7690',B:'#fce6ee',K:'#574a58',C:'#f5b8cf',W:'#c66f96'};
  var CHILD=['..AA........AA..','.ABBA......ABBA.','.ABBBAAAAAABBBA.','.ABBBBBBBBBBBBA.','ABBBBBBBBBBBBBBA','ABBKKBBBBBBKKBBA','ABBKKBBBBBBKKBBA','ABCCBBBBBBBBCCBA','ABBBBBBWWBBBBBBA','ABBBBBBBBBBBBBBA','.ABBBBBBBBBBBBA.','.ABBBBBBBBBBBBA.','..ABBBBBBBBBBA..','..ABBAAAAAABBA..','..AAA......AAA..','................'];
  var s='<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  CHILD.forEach(function(r,y){ for(var x=0;x<16;x++){ var c=PAL[r[x]]; if(c) s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c+'"/>'; } });
  document.getElementById('buddy').innerHTML=s+'</svg>';

  var $=function(id){return document.getElementById(id)}, platform='mercari', files=[], sample=null, limits=null, turns=[], last=null;
  document.querySelectorAll('.seg button').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on')}); b.classList.add('on'); platform=b.dataset.p; }; });

  var RULES='あなたは「おたすけ らいと君」。在宅物販スクールRe:cheの生徒（30〜40代女性・初心者多め）の出品を手伝う、やさしく丁寧なアシスタントです。\n'
  +'■守ること：責めない・急かさない・断定しすぎない。収入を強調する言葉や、安く買って高く売る系の言葉（せ・ど・り、転・売）は使わない。絵文字はタイトル冒頭の✨以外は使わない。生徒が持っているか分からない主張（古物商許可番号・鑑定済み・真贋済み）は書かない。入力にないことを事実のように書かない。\n'
  +'■メルカリの型：タイトルは40字以内で「[状態]+[ブランド]+[アイテム]+[素材/特徴]+[サイズ]+[色]」の検索語全部盛り（冒頭に 美品✨／極美品✨／新品未使用 など状態バッジ）。説明文は ■ブランド／■アイテム／■サイズ（平置き実測の案内）／■状態（欠点も正直に、そのあと「遠目には目立ちません」等のフォロー）／■付属品・購入先／発送（48時間以内など）／ひとこと（使用シーンの短い情緒描写）。ハッシュタグは5〜10個。\n'
  +'■ヤフオクの型：タイトルは65字以内で検索語を多く、説明文は商品詳細→状態→発送方法・日数→落札後の流れ（かんたん決済・取引メッセージ）→注意事項。価格は「開始価格」と「即決価格」の2つで考える。\n'
  +'■価格：仕入れ値の上乗せではなく、同じジャンルの実売の目安（低・中・高）を出す。ブランド品は型番で幅が大きいので「型番を入れて売れた商品を確かめてから」と添える。目安であることを必ず書く。\n'
  +'■足りない情報（サイズ・定価・付属品・色）があれば、やさしく1〜3個だけ提案する。\n';
  function fields(){ return '出品先: '+(platform==='mercari'?'メルカリ':'ヤフオク')+'\nブランド: '+($('brand').value||'（未入力）')+'\n商品: '+($('item').value||'（未入力）')+'\nサイズ: '+($('size').value||'（未入力）')+'\n状態: '+$('cond').value+'\n色・素材: '+($('color').value||'（未入力）')+'\n仕入れ値: '+($('cost').value?$('cost').value+'円':'（未入力）')+'\nメモ: '+($('memo').value||'なし') ; }
  var FORMAT='次のJSONだけを返してください（前後に文章を付けない）: {"title":"（字数制限内のタイトル）","description":"（説明文・改行は\\n）","hashtags":["#..."],"price":{"low":数値,"mid":数値,"high":数値,"label_low":"例：早く売りたい","label_mid":"例：ちょうどよい","label_high":"例：じっくり待てる","note":"目安である注意と根拠を1〜2文"},"start_price":数値または null,"buy_now":数値または null,"missing":["足りない情報の提案（0〜3個）"],"hint":"真贋や写真の撮り方のひとこと（なければ空文字）","cheer":"相棒らしい一言（30字以内・圧ゼロ）"}';

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function yen(n){ n=Number(n)||0; return '¥'+n.toLocaleString('ja-JP'); }
  function copyBtn(txt){ var b=document.createElement('button'); b.className='copy'; b.textContent='コピー'; b.onclick=function(){ try{ navigator.clipboard.writeText(txt); b.textContent='コピーしました'; setTimeout(function(){b.textContent='コピー'},1500);}catch(e){ b.textContent='長押しでコピー'; } }; return b; }
  function render(d){
    last=d; var r=$('result'); r.innerHTML=''; r.hidden=false;
    function sec(title, body, extra){ var h=document.createElement('h3'); h.textContent=title; if(extra) h.appendChild(extra); r.appendChild(h); r.appendChild(body); }
    var t=document.createElement('div'); t.className='box'; t.textContent=d.title||''; var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=(d.title||'').length+' / '+(platform==='mercari'?40:65)+'字'; var w=document.createElement('span'); w.appendChild(cnt); w.appendChild(document.createTextNode(' ')); w.appendChild(copyBtn(d.title||'')); sec('タイトル', t, w);
    var ds=document.createElement('div'); ds.className='box'; ds.textContent=d.description||''; sec('説明文', ds, copyBtn(d.description||''));
    var tags=(d.hashtags||[]).join(' '); var tg=document.createElement('div'); tg.className='box'; tg.textContent=tags; sec('ハッシュタグ', tg, copyBtn(tags));
    var p=d.price||{}; var pr=document.createElement('div'); pr.className='price'; pr.innerHTML='<div><b>'+yen(p.low)+'</b><span>'+esc(p.label_low||'早く売りたい')+'</span></div><div><b>'+yen(p.mid)+'</b><span>'+esc(p.label_mid||'ちょうどよい')+'</span></div><div><b>'+yen(p.high)+'</b><span>'+esc(p.label_high||'じっくり待てる')+'</span></div>'; sec('価格の目安', pr);
    var pn=document.createElement('div'); pn.className='note'; pn.textContent=(p.note||'')+(platform==='yahoo'&&(d.start_price||d.buy_now)?'　開始価格 '+yen(d.start_price)+'／即決 '+yen(d.buy_now):''); r.appendChild(pn);
    var cost=Number($('cost').value)||0; if(cost&&p.mid){ var fee=Math.round(p.mid*0.1); var prof=p.mid-fee-cost; var pf=document.createElement('div'); pf.className='note'; pf.textContent='ちょうどよい価格で売れた場合の見込み：手数料約'+yen(fee)+'を引いて、仕入れ値との差は'+yen(prof)+'（送料は別）。'; r.appendChild(pf); }
    if((d.missing||[]).length||d.hint){ var ck=document.createElement('div'); (d.missing||[]).forEach(function(m){ var x=document.createElement('div'); x.className='check'; x.textContent='・'+m; ck.appendChild(x); }); if(d.hint){ var x2=document.createElement('div'); x2.className='check'; x2.textContent='・'+d.hint; ck.appendChild(x2); } sec('あるともっと良くなるもの', ck); }
    if(d.cheer){ $('greet').textContent=d.cheer; }
    $('chatcard').hidden=false;
  }
  function fail(e){ var m={not_granted:'この画面でClaudeを使う許可が必要です。許可してから、もう一度押してください。',rate_limited:'いま少し混んでいます。少し待ってからもう一度お願いします。',images_unavailable:'この環境では写真を送れません。写真なしで、商品名と状態を入れて進めてください。',image_rejected:'この写真は読み込めませんでした。別の写真（JPEG・PNG）で試してください。',refused:'この内容では下書きを作れませんでした。言い方を変えてもう一度お願いします。',invalid_json:'うまくまとめられませんでした。もう一度「下書きをつくる」を押してください。',cancelled:''}; var t=m[e&&e.code]; if(t===undefined) t='うまくいきませんでした。少し待ってからもう一度お願いします。'; $('err').textContent=t; $('err').hidden=!t; }
  var ctl=null;
  $('go').onclick=function(){
    if(!sample){ $('offnote').hidden=false; return; }
    if(!($('item').value||'').trim()&&!($('brand').value||'').trim()){ $('err').textContent='商品名かブランドを入れてください。'; $('err').hidden=false; return; }
    $('err').hidden=true; var btn=$('go'); btn.disabled=true; btn.textContent='考えています…（30秒ほど）';
    ctl=new AbortController();
    var opts={signal:ctl.signal, cache:false, modelTier:'default'};
    var prompt=RULES+'\n【生徒の入力】\n'+fields()+'\n\n'+FORMAT;
    sample.json(prompt, opts).then(function(d){ render(d); turns=[{role:'user',content:RULES+'\n【生徒の入力】\n'+fields()},{role:'assistant',content:JSON.stringify(d)}]; $('chat').innerHTML=''; })
      .catch(fail).then(function(){ btn.disabled=false; btn.textContent='もう一度つくる'; });
  };
  $('askBtn').onclick=function(){
    var q=($('ask').value||'').trim(); if(!q||!sample||!last) return; $('ask').value='';
    var me=document.createElement('div'); me.className='me'; me.textContent=q; $('chat').appendChild(me);
    var ai=document.createElement('div'); ai.className='ai'; ai.textContent='考えています…'; $('chat').appendChild(ai);
    turns.push({role:'user',content:q+'\n\n直したうえで、同じJSON形式だけを返してください（説明文は全文）。'});
    sample.json(turns,{cache:false, modelTier:'quick'}).then(function(d){ ai.textContent='直しました。上の下書きを更新しています。'; render(d); turns.push({role:'assistant',content:JSON.stringify(d)}); if(turns.length>12) turns.splice(2,2); })
      .catch(function(e){ ai.textContent='うまく直せませんでした。もう一度お願いします。'; fail(e); });
  };
  (async function(){ try{ if(window.claude&&window.claude.use){ sample=await window.claude.use('sample'); } }catch(e){} if(!sample){ $('offnote').hidden=false; } $('fab').hidden=false; })();
})();
</script>
