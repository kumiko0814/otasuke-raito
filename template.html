<title>おたすけ らいと君</title>
<style>

:root[data-theme="dark"]{--bg:#241c26;--paper:#2f2632;--ink:#f1e8ee;--plum:#f3e9f0;--sub:#b9a9b5;--line:#443a48;--soft:#3a3040;--app:linear-gradient(180deg,#2a2130,#241c26);--shadow:0 12px 28px -18px rgba(0,0,0,.6);--okbg:#25382c;--okfg:#9fd6b2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{background:var(--app);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","YuGothic","游ゴシック","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.75;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.app{max-width:560px;margin:0 auto;padding-block:14px 110px;padding-inline:16px}
.hud{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.hud img{height:22px;width:auto}.hud b{color:var(--plum);font-size:14px}.hud small{color:var(--sub);font-size:11px;display:block;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
.bubble{position:relative;flex:1;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:13.5px}
.bubble:before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:var(--soft);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.buddy{width:56px;height:56px;flex:none}.buddy svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--paper);color:var(--plum);border-radius:14px;padding:11px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent}
label{display:block;font-size:12px;font-weight:800;color:var(--plum);margin:10px 0 4px}
label em{font-style:normal;font-weight:700;color:var(--sub);font-size:11px;margin-left:4px}
input,select,textarea{width:100%;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2>div{min-width:0}@media(max-width:420px){.g2{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3>div{min-width:0}.g3 label{margin-top:6px}
.sub{font-size:12px;color:var(--sub);margin-top:4px}
.meas{margin-top:10px;padding:10px 12px;border:1.5px dashed var(--pink);border-radius:16px;background:var(--soft)}
.meas b{font-size:12.5px;color:var(--pinkd)}
.cta{display:block;width:100%;margin-top:14px;text-align:center;font-weight:800;color:#fff;background:var(--grad);border:0;border-radius:999px;padding:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 22px -12px rgba(185,139,234,.7)}
.cta:disabled{opacity:.55;cursor:default}
.ghost{background:var(--paper);color:var(--pinkd);border:1.5px solid var(--pink);box-shadow:none}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;background:#fbe9ee;color:#c66f96;white-space:nowrap}
.pill.lav{background:#efe6f8;color:#7d5cb0}.pill.ok{background:var(--okbg);color:var(--okfg)}
.res h3{font-size:13px;color:var(--plum);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px}.res h3:first-child{margin-top:0}
.res h3 .tools{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.copy{font:inherit;font-size:11.5px;font-weight:800;color:var(--pinkd);background:var(--paper);border:1.5px solid var(--pink);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.box{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.cnt{font-size:11px;color:var(--sub);font-weight:700}
.ex{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}.ex:first-child{border-top:0}
.ex b{flex:none;color:var(--plum);font-variant-numeric:tabular-nums;min-width:68px}.ex span{min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:12.5px;font-weight:700;color:var(--plum);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.check{font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}.check:first-child{border-top:0}
.note{font-size:11.5px;color:var(--sub);margin-top:8px}
.note.strong{color:var(--pinkd);font-weight:800}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btns .cta{margin-top:0;padding:12px;font-size:13.5px}
.err{font-size:13px;color:#b8412a;margin-top:8px;font-weight:700}
.fab{position:fixed;left:12px;bottom:14px;font-size:11px;font-weight:800;color:var(--pinkd);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 12px;box-shadow:var(--shadow);z-index:50}
[hidden]{display:none!important}
</style>

<div class="app">
  <div class="hud"><img src="__LOGO__" alt="Re:che"><div><b>おたすけ らいと君</b><small>商品の情報から、出品文と値付けの下書きをつくります</small></div></div>

  <div class="card"><div class="row"><span class="buddy" id="buddy"></span><div class="bubble" id="greet">こんにちは。出品先を選んで、商品のことを教えてください。タイトル・説明文・ハッシュタグ・価格の目安まで、いっしょに作ります。</div></div></div>

  <div class="card" id="form">
    <label>出品先</label>
    <div class="seg" id="seg"><button type="button" class="on" data-p="mercari">メルカリ出品</button><button type="button" data-p="yahoo">ヤフオク出品</button></div>
    <div class="g2">
      <div><label for="f-brand">ブランド名</label><input id="f-brand" list="dl-brand" autocomplete="off"></div>
      <div><label for="f-item">アイテム名<em>必須</em></label><input id="f-item" autocomplete="off"></div>
    </div>
    <div class="g2">
      <div><label for="f-color">カラー</label><input id="f-color" list="dl-color" autocomplete="off"></div>
      <div><label for="f-sizeLabel">表記サイズ</label><input id="f-sizeLabel" autocomplete="off"></div>
    </div>
    <div class="g2">
      <div><label for="f-material">素材</label><input id="f-material" list="dl-material" autocomplete="off"></div>
      <div><label for="f-condition">状態</label><select id="f-condition"></select></div>
    </div>
    <div class="meas" id="meas" hidden><b id="measTitle">採寸（平置き・cm）</b><div class="g3" id="measGrid"></div></div>
    <label for="f-damage">傷・汚れ<em>あれば</em></label><textarea id="f-damage"></textarea>
    <div class="g2">
      <div><label for="f-model">型番<em>任意</em></label><input id="f-model" autocomplete="off"></div>
      <div><label for="f-refPrice">参考価格（定価・円）<em>任意</em></label><input id="f-refPrice" inputmode="numeric" autocomplete="off"></div>
    </div>
    <div class="g2">
      <div><label for="f-accessories">付属品<em>任意</em></label><input id="f-accessories" autocomplete="off"></div>
      <div><label for="f-purchasedFrom">購入先<em>任意</em></label><input id="f-purchasedFrom" autocomplete="off"></div>
    </div>
    <label for="f-features">その他の特徴<em>任意</em></label><textarea id="f-features"></textarea>
    <div id="chipsWrap" hidden><label>この商品に当てはまるもの<em>タップで選ぶとタイトルに入ります。当てはまらないものは選ばないでください</em></label><div class="chips" id="chips"></div></div>
    <label for="f-cost">仕入れ値（円）<em>任意・見込みの差額を出すだけに使います</em></label><input id="f-cost" inputmode="numeric" placeholder="例）1200" autocomplete="off">
    <button class="cta" id="go" type="button">下書きをつくる</button>
    <div class="err" id="err" hidden></div>
    <datalist id="dl-brand"></datalist><datalist id="dl-color"></datalist><datalist id="dl-material"></datalist>
  </div>

  <div class="card res" id="result" hidden></div>

  <div class="note" style="text-align:center;margin-top:14px">価格は目安です。同じ商品の売り切れ相場を確かめてから決めてください。入れた情報は、この画面の中だけで使います。</div>
</div>

<script>

    function contains(w){
      var n=norm(w);
      return used.some(function(p){ return str(p.t).split(/\s+/).some(function(tk){ var k=norm(tk); return k===n || (len(n)>=3 && k.indexOf(n)>=0); }); });
    }
    parts.forEach(function(p){ p.t=strip(p.t,dict); if(p.t && !contains(p.t)) used.push(p); });
    // 長すぎる：ブランドを和名だけに→末尾の任意語から削る→アイテム名を詰める
    if(len(text())>max && brandAlt){ used.forEach(function(p){ if(p.brand) p.t=brandAlt; }); }
    for(var i=used.length-1; i>=0 && len(text())>max; i--){ if(!used[i].keep) used.splice(i,1); }
    if(len(text())>max){
      var it=used.filter(function(p){return p.item;})[0];
      if(it){ var over=len(text())-max; it.t=Array.from(it.t).slice(0, Math.max(1, len(it.t)-over)).join(''); }
    }
    // 埋める：優先順に試し、ちょうど min〜max に収まる組み合わせを探す（優先度の高い語を先に採用）
    var pool=[];
    cands.forEach(function(w){ w=str(w); if(w && !bad(w,dict) && !contains(w) && pool.every(function(x){ return norm(x)!==norm(w); })) pool.push(w); });
    var baseLen=len(text()), best=[], bestLen=baseLen, budget=20000;
    if(baseLen<min){
      (function dfs(i, cur, chosen){
        if(--budget<0 || bestLen>=min) return;
        if(cur>bestLen){ bestLen=cur; best=chosen.slice(); }
        if(cur>=min) return;
        for(var j=i;j<pool.length;j++){
          var add=len(pool[j])+(cur>0?1:0);
          if(cur+add<=max){ chosen.push(pool[j]); dfs(j+1, cur+add, chosen); chosen.pop(); if(bestLen>=min||budget<0) return; }
        }
      })(0, baseLen, []);
      best.forEach(function(w){ used.push({t:w}); });
    }
    return text();
  }

  /* ---------- 価格 ---------- */
  function benchCat(text){ for(var i=0;i<BENCH_CATS.length;i++){ if(BENCH_CATS[i][1].test(text)) return BENCH_CATS[i][0]; } return ''; }
  function buildPrice(input, brand, cat, cond, bench){
    var noBrand = !brand;
    var fast = brand && /ファスト|ノーブランド/.test(str(brand.category));
    var lux = brand && (brand.luxury_flag===true || /^true$/i.test(str(brand.luxury_flag)));
    var profile = lux ? 'brand' : ((noBrand||fast) ? 'nonbrand' : 'general');
    var labels={brand:'ブランド品の売れた例', nonbrand:'ノーブランド・ファストファッションの売れた例', general:'一般ブランドの売れた例'};
    var key = benchCat([input.item, cat?cat.subcategory:'', cat?cat.category:''].join(' '));
    var out={profile:profile, profileLabel:labels[profile], category:key, n:0, examples:[], note:BENCH_NOTE, refGuide:null, profit:null, fallback:false};
    if(bench && key){
      var src=bench[profile]&&bench[profile][key];
      if(!src){ ['general','brand','nonbrand'].some(function(p){ if(bench[p]&&bench[p][key]){ src=bench[p][key]; out.profile=p; out.profileLabel=labels[p]; out.fallback=true; return true; } return false; }); }
      if(src){ out.n=src.n; out.examples=src.ex.map(function(e){ return {price:e[0], title:e[1]}; }); }
    }
    var ref=toNum(input.refPrice), r=null;
    Object.keys(REF_RATIO).forEach(function(k){ if(sameCond(k, cond.condition)) r=REF_RATIO[k]; });
    if(ref && r){ out.refGuide={refPrice:ref, low:Math.round(ref*r[0]/100)*100, high:Math.round(ref*r[1]/100)*100, text:'参考価格 '+yen(ref)+' × 状態「'+cond.condition+'」の一般的な目安：'+yen(Math.round(ref*r[0]/100)*100)+'〜'+yen(Math.round(ref*r[1]/100)*100)+'（売り切れ相場で必ず確認）'}; }
    var cost=toNum(input.cost);
    if(cost && out.examples.length){
      var mid=out.examples[Math.floor(out.examples.length/2)].price, fee=Math.round(mid*0.1);
      out.profit={mid:mid, fee:fee, cost:cost, diff:mid-fee-cost, text:'中央の例 '+yen(mid)+' で売れた場合：手数料10% 約'+yen(fee)+'を引いて、仕入れ値との差は '+yen(mid-fee-cost)+'（送料は別）'};
    }
    return out;
  }

  /* ---------- 本体 ---------- */
  function generate(input, dict, bench){
    input=input||{}; dict=dict||{};
    if(bench===undefined && typeof BENCH_EX!=='undefined') bench=BENCH_EX; // eslint-disable-line no-undef
    var platform = input.platform==='yahoo' ? 'yahoo' : 'mercari';
    var tpl = (dict.titleTemplates&&dict.titleTemplates[platform]) || DEFAULT_TEMPLATES[platform];
    var min = Number(tpl.min)||DEFAULT_TEMPLATES[platform].min, max = Number(tpl.max)||DEFAULT_TEMPLATES[platform].max;
    var order = (tpl.order&&tpl.order.length) ? tpl.order : DEFAULT_TEMPLATES[platform].order;
    var warnings=[];

    var brandRaw=str(input.brand), isNoBrand=NO_BRAND.indexOf(norm(brandRaw))>=0;
    var brand = isNoBrand ? null : findBrand(brandRaw, dict);
    var cat = detectCategory(input, dict);
    var color = findColor(input.color, dict);
    var mat = findMaterial(input.material, dict);
    var cond = findCondition(input.condition, dict);
    var badge = badgeOf(cond, input, dict);
    var picks=(Array.isArray(input.picks)?input.picks:[]).map(str).filter(Boolean);
    var purchased=str(input.purchasedFrom)||str(input.purchasedAt);
    var userText=[input.item,input.model,input.features,input.damage,input.material,input.accessories,purchased].concat(picks).map(str).join(' ');
    var kwText=[input.features,input.model,input.item,input.damage].concat(picks).map(str).join(' ');

    // ブランド表示
    var bJp='', bEn='', bDisp='';
    if(brand){ bJp=str(brand.brand_name_jp)||str(brand.brand_name); bEn=str(brand.brand_name_en)||str(brand.brand_name); }
    else if(brandRaw && !isNoBrand){ bJp=brandRaw; }
    bDisp = (bJp && bEn && norm(bJp)!==norm(bEn)) ? bJp+' '+bEn : (bJp||bEn);

    // 色
    var cCommon='', cJp='', cEn='';
    if(color){ cCommon=str(color.display_common)||str(color.display_jp); cJp=str(color.display_jp); cEn=str(color.display_en); }
    else if(str(input.color)){ cCommon=str(input.color); }
    var colorAll=uniq([cCommon,cJp,cEn]).join(' ');

    var size=sizeText(input, cat);
    var hv=highValueWords(input, dict, userText, cond);
    var brandName = brand ? str(brand.brand_name) : '';
    var bkw=(dict.brandKeywords||[]).filter(function(k){ return brandName && norm(k.brand)===norm(brandName) && has(kwText,k.keyword); })
      .sort(function(a,b){ return (Number(b.priority)||0)-(Number(a.priority)||0); }).map(function(k){ return str(k.keyword); });
    if(brand){ arr(brand.search_keywords).forEach(function(k){ k=str(k); if(k && has(kwText,k)) bkw.push(k); }); }
    bkw=uniq(bkw);
    if(!cat && brandName){
      // 種類名が辞書に無い（例：エアマックス90）ときは、入力に含まれるブランド別キーワードのカテゴリから判定
      (dict.brandKeywords||[]).forEach(function(k){
        if(cat || norm(k.brand)!==norm(brandName) || !has(kwText,k.keyword)) return;
        (dict.categories||[]).forEach(function(c){ if(!cat && (norm(c.subcategory)===norm(k.category))) cat=c; });
        (dict.categories||[]).forEach(function(c){ if(!cat && (norm(c.category)===norm(k.category))) cat=c; });
      });
      if(cat) size=sizeText(input, cat);
    }
    // カテゴリ推奨語は「この商品に当てはまる」と入力（特徴欄・候補の選択）で確認できたものだけ使う
    var recAll = cat ? arr(cat.recommended_keywords).map(str).filter(function(w){ return w && !bad(w,dict); }) : [];
    var rec = recAll.filter(function(w){ return has(kwText,w); });
    var gender=GENDER_WORDS.filter(function(g){ return has(userText,g); });
    var matName = mat ? str(mat.material) : str(input.material);

    // ---- タイトル ----
    var title, colorAlt=(cJp&&norm(cJp)!==norm(cCommon))?[cJp]:[];
    // 中立の埋め語（優先順）：ブランドの読み／親カテゴリ名／カラー英字／素材英字／性別語／USED（新品以外）／季節語（秋冬・春夏）／ノーブランド（入力時）
    var season = mat && /^(秋冬|春夏)$/.test(str(mat.season)) ? str(mat.season) : '';
    var neutral=[brand?str(brand.reading):'', cat?cat.category:'', cEn, mat?str(mat.english):''].concat(gender, [isNew(cond)?'':'USED', season, isNoBrand?'ノーブランド':'']);   // ノーブランドと入力された時だけ
    var measureWords=[];
    if(cat){ arr(cat.size_fields).forEach(function(f){ var v=str((input.measures||{})[f]); if(v && f!=='表記サイズ') measureWords.push(f+v.replace(/\s*cm$/i,'')+'cm'); }); }
    if(platform==='mercari'){
      // 先頭6つ（状態〜高値ワード）が土台、それ以降の order が埋め候補の優先順
      var slot={
        badge:[{t:badge?'【'+badge+'】':'', keep:true, glue:true}], brand:[{t:bDisp, keep:true, brand:true}], item:[{t:str(input.item), keep:true, item:true}],
        color:[{t:cCommon, keep:true}], size:[{t:size, keep:true}], highValue:hv.map(function(w){return {t:w};})
      };
      var fill={ model:[str(input.model)], brandKeywords:bkw, categoryKeywords:rec, material:[matName], colorAlt:colorAlt, gender:gender };
      var parts=[], cands=[];
      var fillOrder=order.filter(function(k){ return fill[k]; });
      ['model','brandKeywords','categoryKeywords','material','colorAlt','gender'].forEach(function(k){ if(fillOrder.indexOf(k)<0) fillOrder.push(k); });
      order.forEach(function(k){ if(slot[k]) slot[k].forEach(function(p){ parts.push(p); }); });
      fillOrder.forEach(function(k){ cands=cands.concat(fill[k]); });
      cands=cands.concat(neutral);   // 最後は嘘にならない中立の語だけ
      var clone=function(){ return parts.map(function(p){ return Object.assign({}, p); }); };
      title=assemble(clone(), cands, min, max, dict, bJp);
      // ブランド別キーワード（例：ノバチェック）が和英併記で入らないときは、和名だけにして入れる
      if(bkw.length && bJp && bDisp!==bJp){
        var miss=function(t){ return bkw.filter(function(k){ return !has(t,k); }).length; };
        var p2=clone(); p2.forEach(function(p){ if(p.brand) p.t=bJp; });
        var t2=assemble(p2, cands, min, max, dict, bJp);
        if(miss(t2)<miss(title)) title=t2;
      }
    } else {
      var feat=tokens(input.features).concat(picks).filter(function(w){ return !bad(w,dict); });
      var yslot={
        badge:[{t:badge?'【'+badge+'】':'', keep:true, glue:true}], brand:[{t:bDisp, keep:true, brand:true}], item:[{t:str(input.item), keep:true, item:true}],
        model:[{t:str(input.model)}], color:[{t:colorAll, keep:true}], size:[{t:size, keep:true}],
        material:[{t:uniq([matName, mat?str(mat.english):'']).join(' ')}],
        features:feat.concat(hv).map(function(w){return {t:w};}), keywords:bkw.concat(rec).map(function(w){return {t:w};})
      };
      var yparts=[]; order.forEach(function(k){ (yslot[k]||[]).forEach(function(p){ yparts.push(p); }); });
      var ycands=(cat?[cat.subcategory]:[]).concat(neutral, measureWords, [cond.condition.replace(/[、,]/g,''), isNew(cond)?'':'中古', '送料無料']);
      title=assemble(yparts, ycands, min, max, dict, bJp);
    }
    var titleLen=len(title);

    // ---- 不足の案内 ----
    if(!brandRaw) warnings.push('ブランド名を入れると、ブランド名で探す人に見つけてもらいやすくなります（ブランドが無いときは「ノーブランド」でOKです）');
    else if(!brand && !isNoBrand) warnings.push('「'+brandRaw+'」は辞書にないブランドです。入力どおりの表記でタイトルに入れています。和名と英字の両方を入れると検索に強くなります');
    if(!cat) warnings.push('アイテムの種類を判定できませんでした。「ショルダーバッグ」「Tシャツ」のように種類名を入れると、検索キーワードと採寸欄が出ます');
    if(!str(input.color)) warnings.push('色を入れると、タイトルに「ブラック 黒」のように色名が入り、色で探す人に見つかりやすくなります');
    var isBagLike = cat && /バッグ|財布|小物/.test(cat.category);
    if(!str(input.sizeLabel) && !isBagLike) warnings.push('表記サイズ（M・38・27cm など）を入れると、タイトルにサイズが入ります');
    if(!str(input.material)) warnings.push('素材（タグの表記）を入れると、素材名と素材の特長が説明文に入ります');
    var sizeFields = cat ? arr(cat.size_fields).map(str).filter(function(f){ return f && f!=='表記サイズ'; }) : [];
    var measures=input.measures||{};
    var missingM=sizeFields.filter(function(f){ return !str(measures[f]); });
    if(sizeFields.length && missingM.length) warnings.push('採寸（'+missingM.join('・')+'）を入れると、説明文の「（記入してください）」が埋まります');
    var unpicked=recAll.filter(function(w){ return rec.indexOf(w)<0; });
    if(titleLen<min && platform==='yahoo'){
      warnings.push('タイトルが'+titleLen+'字です（目標'+min+'〜'+max+'字）。型番・素材・特徴を足すと検索に強くなります');
    } else if(titleLen<min){
      warnings.push('タイトルが'+titleLen+'字です（目標'+min+'〜'+max+'字）。意味のない言葉では埋めていません。'
        +(unpicked.length ? 'この商品に当てはまる特徴（'+unpicked.slice(0,5).join('／')+' など）があれば選ぶか「その他の特徴」に入れると、タイトルに入ります' : '色・素材・型番・サイズ・特徴を足すと埋まります'));
    }
    (dict.forbidden||[]).forEach(function(w){ if(w && has(userText,w)) warnings.push('「'+w+'」は根拠がある場合のみ使えます（タイトルには入れていません。説明文に残す場合は根拠を書き添えてください）'); });

    // ---- 説明文 ----
    var L=[];
    L.push('■ブランド'); L.push(bDisp || (isNoBrand?'ノーブランド':'（記入してください）')); L.push('');
    L.push('■アイテム'); L.push(uniq([str(input.item), cat?cat.subcategory:'']).join(' ')||'（記入してください）');
    var kwLine=uniq([bDisp].concat(bkw, rec, cat?[cat.subcategory, cat.category]:[])).join(' ');
    if(kwLine) L.push('検索キーワード：'+kwLine);
    L.push('');
    L.push('■商品情報');
    if(str(input.model)) L.push('型番：'+str(input.model));
    if(toNum(input.refPrice)) L.push('参考価格：'+yen(toNum(input.refPrice)));
    L.push('カラー：'+(colorAll||'（記入してください）'));
    if(mat) L.push('素材：'+str(mat.material)+(str(mat.english)&&norm(mat.english)!==norm(mat.material)?'（'+str(mat.english)+'）':'')+(str(mat.feature)?'　'+str(mat.feature):''));
    else L.push('素材：'+(str(input.material)||'（記入してください）'));
    L.push('');
    L.push('■サイズ'); if(size||!isBagLike) L.push('表記サイズ：'+(size||'（記入してください）'));
    sizeFields.forEach(function(f){ var v=str(measures[f]); L.push(f+'：'+(v ? '約'+v.replace(/\s*cm$/i,'')+'cm' : '（記入してください）')); });
    if(sizeFields.length) L.push('※平置きでの採寸のため、多少の誤差はご容赦ください');
    L.push('');
    L.push('■状態'); L.push(cond.condition);
    if(str(cond.acceptable_expression)) L.push(str(cond.acceptable_expression));
    if(str(input.damage)) L.push('気になる点：'+str(input.damage));
    L.push(isNew(cond) ? 'お写真もあわせてご確認ください。' : '気になる点はお写真もあわせてご確認ください。追加のお写真が必要でしたらお気軽にお声がけください。');
    if(str(input.accessories)||purchased){
      L.push(''); L.push('■付属品・購入先');
      if(str(input.accessories)) L.push('付属品：'+str(input.accessories));
      if(purchased) L.push('購入先：'+purchased);
    } else warnings.push('付属品（保存袋・箱・タグなど）や購入先があれば入れると、安心して選んでもらえます');
    var featLine=uniq([str(input.features)].concat(picks.filter(function(w){ return !has(input.features,w); }))).join(' ');
    if(featLine){ L.push(''); L.push('■その他の特徴'); L.push(featLine); }
    var coords=(dict.coords||[]).filter(function(c){ return cat && (norm(c.item_category)===norm(cat.subcategory) || norm(c.item_category)===norm(cat.category)); });
    var cc=coords.filter(function(c){ return cCommon && norm(c.color)===norm(cCommon); });
    var useCo=(cc.length?cc:coords).slice(0,2);
    if(useCo.length){ L.push(''); L.push('■おすすめコーデ'); useCo.forEach(function(c){ L.push('・'+str(c.coordinate)+(str(c.style)?'（'+str(c.style)+'）':'')); }); }
    L.push('');
    L.push('■発送・その他');
    if(platform==='mercari'){
      L.push('・送料無料／即購入OK');
      L.push('・ご購入後1〜2日以内に、丁寧に梱包して発送します');
    } else {
      L.push('・送料無料（落札者様のご負担はありません）');
      L.push('・ご入金確認後1〜2日以内に、丁寧に梱包して発送します');
    }
    if(!isNew(cond)) L.push('・自宅保管のUSED品です。ご理解いただける方のご'+(platform==='mercari'?'購入':'入札')+'をお願いいたします');
    if(platform==='yahoo'){
      L.push(''); L.push('■落札後の流れ');
      L.push('1. 落札後、Yahoo!かんたん決済でお支払いください');
      L.push('2. 取引ナビでお届け先をご確認ください');
      L.push('3. ご入金確認後、1〜2日以内に発送いたします');
      L.push(''); L.push('■注意事項');
      L.push('・お使いの画面により、実物と色味が異なって見える場合がございます');
      L.push('・ご質問は入札前に質問欄からお願いいたします');
      if(!isNew(cond)) L.push('・中古品のため、状態にご理解のある方のご入札をお願いいたします');
    } else {
      L.push('・お使いの画面により、実物と色味が異なって見える場合がございます');
      L.push('・ご不明な点はお気軽にコメントください');
    }
    var description=L.join('\n');

    // ---- ハッシュタグ（8〜10個） ----
    var tagSrc=[bJp, bEn, str(input.item), cat?cat.subcategory:'', cat?cat.category:'', cCommon, matName, badge].concat(bkw, gender, rec,
      ['送料無料', platform==='mercari'?'即購入OK':'ヤフオク', '丁寧梱包', cond.condition, isNew(cond)?'新品':'USED', isNew(cond)?'未使用':'中古']);
    var hashtags=[];
    uniq(tagSrc).forEach(function(t){
      var tag='#'+t.normalize('NFKC').replace(/[\s#＃・,，、。()（）\[\]【】!?！？]/g,'');
      if(tag.length>1 && hashtags.length<10 && !bad(t,dict) && hashtags.indexOf(tag)<0) hashtags.push(tag);
    });

    return {
      platform:platform, title:title, titleLen:titleLen, titleMin:min, titleMax:max,
      description:description, hashtags:hashtags,
      price:buildPrice(input, brand, cat, cond, bench),
      warnings:uniq(warnings),
      fields:{
        brand:brand, brandDisplay:bDisp, category:cat, sizeFields:sizeFields,
        color:color, colorDisplay:colorAll, material:mat, condition:cond.condition, badge:badge, highValue:hv, brandKeywords:bkw
      }
    };
  }

  /* 画面用：この商品に当てはまるか選んでもらう候補（カテゴリ推奨語・ブランド別キーワード） */
  function chips(input, dict){
    var brand=findBrand(input.brand, dict), cat=detectCategory(input, dict), out=[];
    if(cat) arr(cat.recommended_keywords).forEach(function(w){ out.push(str(w)); });
    if(brand) (dict.brandKeywords||[]).forEach(function(k){ if(norm(k.brand)===norm(brand.brand_name)) out.push(str(k.keyword)); });
    return uniq(out).filter(function(w){ return w && !bad(w,dict) && !has(input.item,w); });
  }

  return {generate:generate, chips:chips, detectCategory:detectCategory, findBrand:findBrand, len:len, MEASURE_KEYS:MEASURE_KEYS, BENCH_NOTE:BENCH_NOTE};
})();
if(typeof module!=='undefined') module.exports=RAITO;

</script>
<script>
/* app.js */
/* おたすけ らいと君 画面（入力 → RAITO.generate → 表示・コピー・JSON書き出し・任意のAI補助） */
(function(){
  'use strict';
  var DICT = (typeof RAITO_DICT !== 'undefined') ? RAITO_DICT : null;           // eslint-disable-line no-undef
  var BENCH = (typeof BENCH_EX !== 'undefined') ? BENCH_EX : null;              // eslint-disable-line no-undef
  var $ = function(id){ return document.getElementById(id); };
  var platform = 'mercari', last = null, lastInput = null, sample = null, origDesc = null;
  var FIELDS = ['brand','item','model','refPrice','color','material','sizeLabel','condition','damage','accessories','purchasedFrom','features','cost'];
  var CONDITIONS_FALLBACK = ['新品未使用','未使用に近い','目立った傷や汚れなし','やや傷や汚れあり','傷や汚れあり'];

  /* 相棒のドット絵 */
  (function(){
    var PAL={A:'#8a7690',B:'#fce6ee',K:'#574a58',C:'#f5b8cf',W:'#c66f96'};
    var CHILD=['..AA........AA..','.ABBA......ABBA.','.ABBBAAAAAABBBA.','.ABBBBBBBBBBBBA.','ABBBBBBBBBBBBBBA','ABBKKBBBBBBKKBBA','ABBKKBBBBBBKKBBA','ABCCBBBBBBBBCCBA','ABBBBBBWWBBBBBBA','ABBBBBBBBBBBBBBA','.ABBBBBBBBBBBBA.','.ABBBBBBBBBBBBA.','..ABBBBBBBBBBA..','..ABBAAAAAABBA..','..AAA......AAA..','................'];
    var s='<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
    CHILD.forEach(function(r,y){ for(var x=0;x<16;x++){ var c=PAL[r[x]]; if(c) s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c+'"/>'; } });
    $('buddy').innerHTML=s+'</svg>';
  })();

  if(!DICT || typeof RAITO === 'undefined'){
    $('err').textContent='辞書が読み込めませんでした。少し待ってから、ページを読み込み直してください。';
    $('err').hidden=false; $('go').disabled=true; return;
  }

  /* 入力欄の準備：ラベル・例文は辞書の inputFields を優先 */
  var KEY_ALIAS={purchasedAt:'purchasedFrom'};
  (DICT.inputFields||[]).forEach(function(f){
    if(f.type==='measure') return;
    var el=$('f-'+(KEY_ALIAS[f.key]||f.key)); if(!el) return;
    if(f.placeholder) el.placeholder=f.placeholder;
    var lb=document.querySelector('label[for="f-'+(KEY_ALIAS[f.key]||f.key)+'"]');
    if(lb && f.label){ var em=lb.querySelector('em'); lb.textContent=f.label; if(em) lb.appendChild(em); }
  });
  if(!$('f-brand').placeholder) $('f-brand').placeholder='例）COACH／ユニクロ／ノーブランド';
  if(!$('f-item').placeholder) $('f-item').placeholder='例）ショルダーバッグ／Tシャツ';
  function fillList(id, values){ var dl=$(id); values.forEach(function(v){ if(!v) return; var o=document.createElement('option'); o.value=v; dl.appendChild(o); }); }
  fillList('dl-brand', (DICT.brands||[]).map(function(b){ return b.brand_name_jp||b.brand_name; }).concat(['ノーブランド']));
  fillList('dl-color', (DICT.colors||[]).map(function(c){ return c.display_common; }));
  fillList('dl-material', (DICT.materials||[]).map(function(m){ return m.material; }));
  var conds=(DICT.conditions&&DICT.conditions.length) ? DICT.conditions.map(function(c){ return c.condition; }) : CONDITIONS_FALLBACK;
  conds.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; $('f-condition').appendChild(o); });
  $('f-condition').value = conds.indexOf('目立った傷や汚れなし')>=0 ? '目立った傷や汚れなし' : conds[0];

  /* 採寸欄：アイテムの種類を判定して、その size_fields だけ出す */
  var measVals={}, MEAS_PH={};
  (DICT.inputFields||[]).concat(DICT.extraMeasureFields||[]).forEach(function(f){ if(f.type==='measure' && f.label) MEAS_PH[f.label]=f.placeholder||'cm'; });
  function renderMeasures(){
    var cat=RAITO.detectCategory({item:$('f-item').value, model:$('f-model').value, features:$('f-features').value}, DICT);
    var flds=cat ? [].concat(cat.size_fields||[]).filter(function(f){ return f && f!=='表記サイズ'; }) : [];
    var grid=$('measGrid');
    grid.querySelectorAll('input').forEach(function(i){ measVals[i.dataset.k]=i.value; });
    grid.innerHTML='';
    $('meas').hidden=!flds.length;
    if(!flds.length) return;
    $('measTitle').textContent='採寸（'+cat.subcategory+'・平置き・cm）';
    flds.forEach(function(k){
      var d=document.createElement('div'), id='m-'+k;
      var lb=document.createElement('label'); lb.htmlFor=id; lb.textContent=k;
      var inp=document.createElement('input'); inp.id=id; inp.dataset.k=k; inp.inputMode='decimal'; inp.placeholder=MEAS_PH[k]||'cm'; inp.value=measVals[k]||'';
      d.appendChild(lb); d.appendChild(inp); grid.appendChild(d);
    });
  }
  /* 当てはまる特徴の候補（辞書のカテゴリ推奨語・ブランド別キーワード）。選んだものだけタイトルに入る */
  var picked={};
  function renderChips(){
    var list=RAITO.chips({brand:$('f-brand').value, item:$('f-item').value, model:$('f-model').value, features:$('f-features').value}, DICT);
    var box=$('chips'); box.innerHTML=''; $('chipsWrap').hidden=!list.length;
    list.forEach(function(w){
      var b=el('button',null,w); b.type='button'; b.setAttribute('aria-pressed', picked[w]?'true':'false');
      b.onclick=function(){ picked[w]=!picked[w]; b.setAttribute('aria-pressed', picked[w]?'true':'false'); };
      box.appendChild(b);
    });
  }
  ['f-item','f-model','f-features'].forEach(function(id){ $(id).addEventListener('input', renderMeasures); });
  ['f-brand','f-item','f-model'].forEach(function(id){ $(id).addEventListener('input', renderChips); });

  function collect(){
    var inp={platform:platform, measures:{}};
    FIELDS.forEach(function(k){ var el=$('f-'+k); if(el) inp[k]=(el.value||'').trim(); });
    $('measGrid').querySelectorAll('input').forEach(function(i){ if(i.value.trim()) inp.measures[i.dataset.k]=i.value.trim(); });
    inp.picks=[].slice.call($('chips').querySelectorAll('button[aria-pressed="true"]')).map(function(b){ return b.textContent; });
    return inp;
  }

  /* 表示 */
  function yen(n){ n=Math.round(Number(n)||0); return (n<0?'-':'')+'¥'+Math.abs(n).toLocaleString('ja-JP'); }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function copyText(txt, btn){
    var done=function(){ btn.textContent='コピーしました'; setTimeout(function(){ btn.textContent='コピー'; },1500); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, fallback); }
      else fallback();
    }catch(e){ fallback(); }
    function fallback(){
      try{ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); if(ok) done(); else btn.textContent='長押しでコピー'; }
      catch(e){ btn.textContent='長押しでコピー'; }
    }
  }
  function copyBtn(getText, id){ var b=el('button','copy','コピー'); b.type='button'; if(id) b.id=id; b.onclick=function(){ copyText(getText(), b); }; return b; }
  function head(r, title, tools){ var h=el('h3'); h.appendChild(document.createTextNode(title)); if(tools){ var t=el('span','tools'); tools.forEach(function(x){ t.appendChild(x); }); h.appendChild(t); } r.appendChild(h); }

  function render(d){
    last=d; origDesc=null;
    var r=$('result'); r.innerHTML=''; r.hidden=false;
    var ok = d.titleLen>=d.titleMin && d.titleLen<=d.titleMax;
    var cnt=el('span','pill '+(ok?'ok':'lav'), d.titleLen+'字（目標 '+d.titleMin+'〜'+d.titleMax+'字）'); cnt.id='titleCount';
    head(r, 'タイトル', [cnt, copyBtn(function(){ return last.title; }, 'copyTitle')]);
    var t=el('div','box',d.title); t.id='outTitle'; r.appendChild(t);

    var descTools=[copyBtn(function(){ return last.description; }, 'copyDesc')];
    if(sample){ var ai=el('button','copy','説明文をなめらかに'); ai.type='button'; ai.id='aiSmooth'; ai.onclick=function(){ smooth(ai); }; descTools.unshift(ai); }
    head(r, '説明文', descTools);
    var ds=el('div','box',d.description); ds.id='outDesc'; r.appendChild(ds);
    var aiNote=el('div','note'); aiNote.id='aiNote'; aiNote.hidden=true; r.appendChild(aiNote);

    var tags=d.hashtags.join(' ');
    head(r, 'ハッシュタグ（'+d.hashtags.length+'個）', [copyBtn(function(){ return last.hashtags.join(' '); })]);
    r.appendChild(el('div','box',tags));

    var p=d.price||{};
    head(r, '価格の目安');
    var pb=el('div','box'); pb.style.whiteSpace='normal';
    if(p.examples && p.examples.length){
      pb.appendChild(el('div','cnt',p.profileLabel+'（'+p.category+'・'+p.n+'件から低・中・高の3例）'));
      p.examples.forEach(function(e){ var row=el('div','ex'); row.appendChild(el('b',null,yen(e.price))); row.appendChild(el('span',null,e.title)); pb.appendChild(row); });
    } else {
      pb.appendChild(el('div',null,'このジャンルの売れた例はまだ登録がありません。メルカリで「売り切れ」に絞って、同じ商品の価格を確かめてください。'));
    }
    r.appendChild(pb);
    r.appendChild(el('div','note strong', p.note || RAITO.BENCH_NOTE));
    if(p.refGuide) r.appendChild(el('div','note', p.refGuide.text));
    if(p.profit) r.appendChild(el('div','note', p.profit.text));

    if(d.warnings.length){
      head(r, 'あるともっと良くなるもの');
      var ck=el('div'); d.warnings.forEach(function(w){ ck.appendChild(el('div','check','・'+w)); }); r.appendChild(ck);
    }

    var btns=el('div','btns');
    var j1=el('button','cta ghost','JSONを保存'); j1.type='button'; j1.onclick=saveJson;
    var j2=el('button','cta ghost','JSONをコピー'); j2.type='button'; j2.onclick=function(){ copyText(JSON.stringify(exportObj(),null,2), j2); setTimeout(function(){ j2.textContent='JSONをコピー'; },1600); };
    btns.appendChild(j1); btns.appendChild(j2); r.appendChild(btns);

    $('greet').textContent = ok
      ? 'タイトルは'+d.titleLen+'字で、ちょうど良い長さです。説明文の「（記入してください）」があれば、埋めてから出品してくださいね。'
      : 'タイトルが'+d.titleLen+'字です。下の「あるともっと良くなるもの」を足すと、検索に強いタイトルになります。';
  }

  function exportObj(){ return {input:lastInput, output:{platform:last.platform,title:last.title,titleLen:last.titleLen,description:last.description,hashtags:last.hashtags,price:last.price,warnings:last.warnings}}; }
  function saveJson(){
    var txt=JSON.stringify(exportObj(),null,2);
    try{
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
      a.download='raito_'+(last.platform)+'_'+Date.now()+'.json'; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }catch(e){ $('err').textContent='保存できない環境です。「JSONをコピー」を使ってください。'; $('err').hidden=false; }
  }

  function run(){
    var inp=collect();
    if(!inp.item && !inp.brand){ $('err').textContent='アイテム名を入れてください。'; $('err').hidden=false; return; }
    $('err').hidden=true;
    lastInput=inp;
    render(RAITO.generate(inp, DICT, BENCH));
    $('go').textContent='入れ直して、もう一度つくる';
  }
  $('go').onclick=function(){ run(); $('result').scrollIntoView({behavior:'smooth', block:'start'}); };
  document.querySelectorAll('#seg button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#seg button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); platform=b.dataset.p;
      if(last) run();
    };
  });

  /* ---- 任意のAI補助：説明文の言い回しだけ整える（タイトルは渡さない） ---- */
  var EMOJI=/\p{Extended_Pictographic}/u;
  function headings(t){ return (t.match(/^■.*$/gm)||[]).join('\n'); }
  function numbers(t){ return (t.normalize('NFKC').match(/\d+(?:[.,]\d+)*/g)||[]).sort().join(','); }
  function smooth(btn){
    var src=last.description;
    var ng=(DICT.forbidden||[]).concat(DICT.fillerWords||[]);
    var prompt='次の出品説明文の言い回しだけを、やさしく丁寧で読みやすい日本語に整えてください。\n'
      +'守ること：\n- 構造（■で始まる見出しの文言・順番）を一字も変えない\n- 事実・数値・サイズ・価格・型番・状態の内容を変えない。足さない・削らない\n'
      +'- 全体の字数をほぼ変えない（±15%以内）\n- 絵文字・顔文字・記号の飾りを使わない\n- 「（記入してください）」はそのまま残す\n'
      +'- 次の語は使わない：'+ng.join('、')+'\n'
      +'整えた説明文の本文だけを返してください（前置きや説明は書かない）。\n\n---\n'+src;
    btn.disabled=true; btn.textContent='整えています…';
    var note=$('aiNote');
    sample(prompt, {modelTier:'quick'}).then(function(res){
      var out=String(res&&res.text||'').trim();
      var bad=ng.filter(function(w){ return w && out.indexOf(w)>=0 && src.indexOf(w)<0; });
      var lenOk=Math.abs(out.length-src.length) <= src.length*0.2;
      if(!out || res.truncated || headings(out)!==headings(src) || numbers(out)!==numbers(src) || EMOJI.test(out) || bad.length || !lenOk){
        note.textContent='整えた結果が見出しや数値を変えてしまったので、元の説明文のままにしています。'; note.hidden=false; return;
      }
      origDesc=src; last.description=out; $('outDesc').textContent=out;
      note.textContent='言い回しを整えました（見出し・数値は元のままです）。'; note.hidden=false;
      var undo=el('button','copy','元に戻す'); undo.type='button'; undo.style.marginLeft='6px';
      undo.onclick=function(){ last.description=origDesc; $('outDesc').textContent=origDesc; note.hidden=true; };
      note.appendChild(undo);
    }).catch(function(e){
      var code=e&&e.code;
      if(code==='not_granted'){ btn.hidden=true; return; }
      note.textContent= code==='rate_limited' ? 'いま混み合っています。少し待ってからもう一度お願いします。' : '今回は整えられませんでした。元の説明文はそのまま使えます。';
      note.hidden=false;
    }).then(function(){ btn.disabled=false; btn.textContent='説明文をなめらかに'; });
  }
  (async function(){
    try{ if(window.claude && typeof window.claude.use==='function'){ sample = await window.claude.use('sample'); } }catch(e){ sample=null; }
    if(sample && last) render(last);
  })();
})();

</script>
